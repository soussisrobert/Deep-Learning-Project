[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hift-research"
version = "0.1.0"
description = "Auditable HiFT reproduction and source-resolution diagnostics"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.2,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "jsonschema>=4,<5", "Pillow==12.1.1", "opencv-python==4.13.0.92"]
data = ["Pillow==12.1.1", "opencv-python==4.13.0.92"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
