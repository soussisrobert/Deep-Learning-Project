name: verify-paper-numbers
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r environment/requirements-verify.txt
      - run: python scripts/verify_paper_numbers.py
      - run: python scripts/check_evidence_checksums.py
